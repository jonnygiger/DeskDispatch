services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskdispatch-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/deskdispatch
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: deskdispatch-bucket
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadminpassword
      S3_REGION: us-east-1
      SESSION_SECRET: super-secret-key-change-me
      BIND_ADDRESS: 0.0.0.0:3000
      APP_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: deskdispatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deskdispatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deskdispatch"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: deskdispatch-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskdispatch-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/deskdispatch
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: deskdispatch-bucket
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadminpassword
      S3_REGION: us-east-1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test
      ADMIN_DISPLAY_NAME: Admin
      APP_ENV: production
    entrypoint: ["/app/deskdispatch", "setup"]

volumes:
  postgres_data:
  rustfs_data:
