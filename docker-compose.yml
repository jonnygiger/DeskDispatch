services:
  postgres:
    image: postgres:16
    container_name: deskdispatch-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deskdispatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deskdispatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: deskdispatch-rustfs
    restart: always
    environment:
      RUSTFS_ROOT_USER: minioadmin
      RUSTFS_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs-create-bucket:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: deskdispatch-rustfs-create-bucket
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myrustfs http://rustfs:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myrustfs/deskdispatch-bucket --ignore-existing;
      exit 0;
      "

volumes:
  postgres_data:
  rustfs_data:
