services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskdispatch-app
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:deskdispatch_db_prod_secret_9823@postgres:5432/deskdispatch
      PUBLIC_BASE_URL: http://localhost:3000
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: deskdispatch-bucket
      S3_ACCESS_KEY: deskdispatch_s3_user
      S3_SECRET_KEY: deskdispatch_s3_prod_secret_4712
      S3_REGION: us-east-1
      SESSION_SECRET: deskdispatch_session_prod_secret_8832
      BIND_ADDRESS: 0.0.0.0:3000
      APP_ENV: production
    healthcheck:
      test: ["CMD", "/app/deskdispatch", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18-alpine
    container_name: deskdispatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deskdispatch_db_prod_secret_9823
      POSTGRES_DB: deskdispatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deskdispatch"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: deskdispatch-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: deskdispatch_s3_user
      RUSTFS_ROOT_PASSWORD: deskdispatch_s3_prod_secret_4712
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskdispatch-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:deskdispatch_db_prod_secret_9823@postgres:5432/deskdispatch
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: deskdispatch-bucket
      S3_ACCESS_KEY: deskdispatch_s3_user
      S3_SECRET_KEY: deskdispatch_s3_prod_secret_4712
      S3_REGION: us-east-1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test
      ADMIN_DISPLAY_NAME: Admin
      APP_ENV: production
    entrypoint: ["/app/deskdispatch", "setup"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  rustfs_data:
