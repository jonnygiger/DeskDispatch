services:
  postgres:
    image: postgres:16
    container_name: deskdispatch-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deskdispatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deskdispatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
