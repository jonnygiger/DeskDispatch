[package]
name = "deskdispatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[workspace]
members = [".", "crates/deskdispatch-protocol"]

[lints.clippy]
unwrap_used = "deny"

[dependencies]
deskdispatch-protocol = { path = "crates/deskdispatch-protocol" }
argon2 = "0.6"
askama = "0.16"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
aws-config = "1.12"
aws-sdk-s3 = "1.152"
axum = "0.8"
chrono-tz = "0.10"
croner = "4.0"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-deflate", "compression-br", "trace", "request-id", "timeout", "catch-panic"] }
mime_guess = "2.0"
rust-embed = "8.13"
secrecy = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
image = "0.25"
urlencoding = "2.1"
utoipa = { version = "5.5", features = ["axum_extras", "chrono"] }

[dev-dependencies]
proptest = "1.11"
