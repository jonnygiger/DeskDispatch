[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
askama = "0.12"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
aws-config = "1.5"
aws-sdk-s3 = "1.78"
axum = "0.8"
croner = "2.1"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "uuid"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
