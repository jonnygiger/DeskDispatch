[package]
name = "deskdispatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[workspace]
members = [".", "crates/deskdispatch-protocol", "crates/worker-simulator", "crates/deskdispatch-worker"]

[lints.clippy]
unwrap_used = "deny"
collapsible_if = "allow"
explicit_auto_deref = "allow"

[dependencies]
deskdispatch-protocol = { path = "crates/deskdispatch-protocol" }
argon2 = "0.6"
askama = "0.16"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
axum = "0.8"
chrono-tz = "0.10"
reqwest = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_html_form = "0.2"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-deflate", "compression-br", "trace", "request-id", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
png = "0.18"
cron = "0.15"
crc32fast = "1.4"
base64 = "0.22"
zip = { version = "2.2", default-features = false }

[dev-dependencies]
proptest = "1.11"
reqwest = { version = "0.12", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
