<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User admin - DeskDispatch</title>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>


<header class="top-nav">
    <a href="/" class="top-nav-brand">
        DeskDispatch
    </a>
    <ul class="top-nav-menu">
        <li><a href="/" >Dashboard</a></li>
        <li><a href="/automations" >Automations</a></li>
        <li><a href="/schedules" >Schedules</a></li>
        <li><a href="/runs" >Runs</a></li>
        <li><a href="/workers" >Workers</a></li>

        <li><a href="/users" class="active" aria-current="page">Users</a></li>

    </ul>
    <div class="top-nav-user">
        <a href="/account" >Admin User</a>
        <form method="post" action="/logout" style="display:inline;">

<input type="hidden" name="csrf_token" value="test_csrf_token_12345" />

            <button type="submit" class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.8125rem;">Log out</button>
        </form>
    </div>
</header>



    <div class="app-container">

        <main id="main-content" class="main-content">


<div class="dashboard-header" style="margin-bottom: 1.5rem;">
    <h1 class="dashboard-title">Edit User: admin</h1>
    <p style="color: var(--color-text-muted); margin-top: 0.25rem;">Update user details, role, and active account status.</p>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">


    <form method="post" action="/users/1">

<input type="hidden" name="csrf_token" value="test_csrf_token_12345" />


        <div class="form-group" style="margin-bottom: 1.25rem;">
            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Username</label>
            <input type="text" value="admin" disabled style="width: 100%; padding: 0.625rem; border: 1px solid var(--color-border); border-radius: 6px; box-sizing: border-box; background: var(--color-bg-secondary); color: var(--color-text-muted);">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="display_name" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Display Name</label>
            <input type="text" id="display_name" name="display_name" value="Admin User" required style="width: 100%; padding: 0.625rem; border: 1px solid var(--color-border); border-radius: 6px; box-sizing: border-box;">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="role" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Role</label>
            <select id="role" name="role" required style="width: 100%; padding: 0.625rem; border: 1px solid var(--color-border); border-radius: 6px; box-sizing: border-box;">
                <option value="editor" >Editor (Full automation/schedule edit rights)</option>
                <option value="admin" selected>Admin (Full administrative & user management rights)</option>
                <option value="viewer" >Viewer (Read-only access)</option>
            </select>
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" name="is_active" value="true" checked>
                <span>Account Active (Unchecking will terminate all active sessions)</span>
            </label>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" name="must_change_password" value="true" >
                <span>Require password change on next login</span>
            </label>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/users/1/reset-password" class="btn btn-outline">Reset User Password</a>
            <div style="display: flex; gap: 0.75rem;">
                <a href="/users" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </form>
</div>

        </main>
    </div>

    <footer class="footer">

        &copy; DeskDispatch — Task Server

    </footer>
</body>
</html>
