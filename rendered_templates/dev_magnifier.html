<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnifier Component Verification</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="padding: 2rem;">
    <h1>Magnifier Component Verification</h1>
    <p>
        Dimensions: 800x600 |

            Target: (100, 150)

    </p>
    <div class="shot-container">
    <div class="shot shot--normal" style="background-image: url(&#39;https://via.placeholder.com/800x600.png&#39;); background-size: contain; background-position: center;">

        <span class="marker" style="left: 130.00px; top: 85.00px;"></span>

    </div>
    <div class="shot shot--zoom400" style="background-image: url(&#39;https://via.placeholder.com/800x600.png&#39;); background-size: 3200px 2400px; background-position: -240.00px -440.00px;">

        <span class="marker" style="left: 160px; top: 160px;"></span>

    </div>
    <div class="shot shot--grid" style="--grid-bg-url: url(&#39;https://via.placeholder.com/800x600.png&#39;); --grid-bg-w: 16000px; --grid-bg-h: 12000px; --grid-pan-x: -1850.00px; --grid-pan-y: -2850.00px;">

        <span class="marker" style="left: 160px; top: 160px;"></span>

    </div>
</div>
</body>
</html>
