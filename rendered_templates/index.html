<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DeskDispatch</title>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>


<header class="top-nav">
    <a href="/" class="top-nav-brand">
        DeskDispatch
    </a>
    <ul class="top-nav-menu">
        <li><a href="/" class="active">Dashboard</a></li>
        <li><a href="/automations" >Automations</a></li>
        <li><a href="/schedules" >Schedules</a></li>
        <li><a href="/runs" >Runs</a></li>
        <li><a href="/workers" >Workers</a></li>

        <li><a href="/users" >Users</a></li>

    </ul>
    <div class="top-nav-user">
        <a href="/account" >Admin User</a>
        <form method="post" action="/logout" style="display:inline;">

<input type="hidden" name="csrf_token" value="test_csrf_token_12345" />

            <button type="submit" class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.8125rem;">Log out</button>

        <h1 style="font-size: 1.5rem; color: var(--color-text);">DeskDispatch Dashboard</h1>
        <div style="font-size: 0.875rem; color: var(--color-text-muted);">
            Logged in as <strong>Admin User</strong> (admin, role: admin)
        </div>
    </div>
    <p>Welcome to DeskDispatch.</p>
    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <a href="/account/password" class="btn btn-primary">Change Password</a>
        <form method="post" action="/logout" style="display:inline;">

<input type="hidden" name="csrf_token" value="test_csrf_token_12345" />

            <button type="submit" class="btn btn-danger">Log Out</button>
        </form>
    </div>
</div>

        </main>
    </div>

    <footer class="footer">

        &copy; DeskDispatch — Task Server

    </footer>
