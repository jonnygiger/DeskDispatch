<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DeskDispatch</title>
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>


<header class="top-nav">
    <a href="/" class="top-nav-brand">
        DeskDispatch
    </a>
    <ul class="top-nav-menu">
        <li><a href="/" class="active">Dashboard</a></li>
        <li><a href="/automations" >Automations</a></li>
        <li><a href="/schedules" >Schedules</a></li>
        <li><a href="/runs" >Runs</a></li>
        <li><a href="/workers" >Workers</a></li>

        <li><a href="/users" >Users</a></li>

    </ul>
    <div class="top-nav-user">
        <a href="/account" >Admin User</a>
        <form method="post" action="/logout" style="display:inline;">

<input type="hidden" name="csrf_token" value="test_csrf_token_12345" />

            <button type="submit" class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.8125rem;">Log out</button>
        </form>
    </div>
</header>



    <div class="app-container">

        <main class="main-content">

<div class="dashboard-header">
    <h1 class="dashboard-title">Dashboard</h1>
    <div class="dashboard-actions">
        <a href="/automations/new" class="btn btn-primary">+ New Automation</a>
        <a href="/schedules/new" class="btn btn-outline">+ New Schedule</a>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-label">Active Automations</div>
        <div class="stat-value">5</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Workers Online</div>
        <div class="stat-value">3</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Runs Today</div>
        <div class="stat-value">12</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Failed / Lost Runs Today</div>
        <div class="stat-value text-danger">1</div>
    </div>
</div>

        </main>
    </div>

    <footer class="footer">

        &copy; DeskDispatch — Task Server

    </footer>
</body>
</html>
