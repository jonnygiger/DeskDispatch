[package]
name = "worker-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[lints.clippy]
unwrap_used = "deny"

[dependencies]
deskdispatch-protocol = { path = "../deskdispatch-protocol" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
image = "0.25"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.28", features = ["v4"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono"] }
sha2 = "0.11"
hex = "0.4"
